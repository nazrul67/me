      - name: Start Safe RDP Tunnel & Get IP
        run: |
          # ব্যাকগ্রাউন্ডে ngrok চালু করা
          Start-Process ngrok -ArgumentList "tcp 3389" -WindowStyle Hidden
          
          # ngrok রেডি হওয়ার জন্য সর্বোচ্চ ১০ বার চেষ্টা করবে
          $retryCount = 0
          $ngrok_url = $null
          
          while ($null -eq $ngrok_url -and $retryCount -lt 10) {
              Start-Sleep -Seconds 3
              try {
                  # সঠিক আইপি ১২৭.০.০.১ এবং পোর্ট ৪০৪০ ব্যবহার করা হয়েছে
                  $response = Invoke-WebRequest -Uri "http://127.0.0" -UseBasicParsing -ErrorAction Stop
                  $ngrok_url = ($response.Content | ConvertFrom-Json).tunnels.public_url
              } catch {
                  $retryCount++
                  Write-Host "Waiting for ngrok to start... (Attempt $retryCount/10)"
              }
          }
          
          # ইউআরএল পাওয়া গেলে স্ক্রিনে সুন্দরভাবে প্রিন্ট করবে
          if ($ngrok_url) {
              $clean_url = $ngrok_url.Replace("tcp://", "")
              Write-Host "=========================================" -ForegroundColor Green
              Write-Host "RDP Address: $clean_url" -ForegroundColor Cyan
              Write-Host "Username: uk" -ForegroundColor Cyan
              Write-Host "Password: Uk@2026" -ForegroundColor Cyan
              Write-Host "=========================================" -ForegroundColor Green
          } else {
              Write-Host "Error: ngrok টানেল তৈরি করতে পারেনি! আপনার Authtoken ঠিক আছে কি?" -ForegroundColor Red
              exit 1
          }

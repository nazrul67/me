name: Mobile Touch Android Cloud (Web)
on: workflow_dispatch

jobs:
  launch-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Hardware Acceleration (KVM) and GUI Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils nodejs npm
          # ভার্চুয়াল ডিসপ্লে বাফার এবং নো-ভিএনসি প্রক্সি ইনস্টল করা
          sudo apt-get install -y xvfb openbox x11vnc novnc websockify
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm

      - name: Install Android SDK and Tools
        uses: android-actions/setup-android@v3

      - name: Install ngrok via NPM
        run: |
          sudo npm install -g ngrok --unsafe-perm=true --allow-root
          echo "ngrok installed successfully!"

      - name: Configure ngrok Token
        run: |
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Create and Start Android Emulator (Wait For System Ready)
        run: |
          echo "y" | sdkmanager --install "system-images;android-33;google_apis;x86_64"
          echo "no" | avdmanager create avd -n AndroidCloud -k "system-images;android-33;google_apis;x86_64" --force
          
          # ভার্চুয়াল ডিসপ্লে স্ক্রিন চালু করা
          Xvfb :1 -screen 0 1080x1920x24 > /dev/null 2>&1 &
          export DISPLAY=:1
          sleep 3
          
          # সফটওয়্যার রেন্ডারিং ও নো-উইন্ডো পলিসি ব্যবহার করে এমুলেটর চালু
          $ANDROID_HOME/emulator/emulator -avd AndroidCloud -no-audio -no-snapshot-save -no-window -gpu swiftshader_indirect -camera-back none -camera-front none > /dev/null 2>&1 &
          echo "Android Emulator is booting in background..."
          
          # অ্যান্ড্রয়েড সিস্টেমটি সম্পূর্ণ রেডি হওয়া পর্যন্ত স্ক্রিপ্টটি লুপে অপেক্ষা করবে (ব্ল্যাক স্ক্রিন এড়াতে)
          echo "Waiting for Android to complete booting (It may take 2-3 minutes)..."
          $ANDROID_HOME/platform-tools/adb wait-for-device
          
          # হোম স্ক্রিন (Launcher) লোড হওয়া পর্যন্ত ওয়েট লুপ
          until [[ "$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null)" == "1" ]]; do
            echo "Still booting..."
            sleep 10
          done
          
          # স্ক্রিন যেন লক না হয়ে যায় তাই ডিসপ্লে লক অক্ষম (Disable) করা
          $ANDROID_HOME/platform-tools/adb shell wm dismiss-keyguard
          echo "Android Boot Completed Successfully!"

      - name: Setup Web Display Server (noVNC Setup)
        run: |
          export DISPLAY=:1
          # ডিসপ্লে বাফার রিফ্রেশ ঠিক রাখতে VNC সেশন চালু করা (পোর্ট ৫৯০০)
          x11vnc -display :1 -forever -shared -bg -nopw -rfbport 5900 -noxdamage > /dev/null 2>&1 &
          sleep 5
          
          # ব্রাউজার স্ট্রিমিং ও টাচ ইন্টারফেস অ্যাক্টিভেট করা (পোর্ট ৬০৮০)
          websockify --web /usr/share/novnc/ 6080 localhost:5900 > /dev/null 2>&1 &
          sleep 5

      - name: Start Safe HTTP Tunnel for Mobile Chrome
        run: |
          # পোর্ট ৬০৮০ কে Ngrok এর মাধ্যমে পাবলিক ওয়েবসাইট লিঙ্কে রূপান্তর করা
          ngrok http 6080 > /dev/null 2>&1 &
          
          echo "=========================================================="
          echo "Android Web Server Started Successfully!"
          echo "Open your Ngrok Dashboard, copy the HTTP URL and open it in your Mobile Chrome Browser."
          echo "Once opened, click the 'Connect' button to see and touch the Android screen!"
          echo "=========================================================="
          
          # সেশনটি ৬ ঘণ্টা সচল রাখবে
          sleep 21600 

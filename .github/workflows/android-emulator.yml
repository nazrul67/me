name: Mobile Touch Android Cloud (Web)
on: workflow_dispatch

jobs:
  launch-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Hardware Acceleration (KVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils nodejs npm
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm

      - name: Install Android SDK and Tools
        uses: android-actions/setup-android@v3

      - name: Install ngrok (Official Direct Binary Setup)
        run: |
          # অফিশিয়াল আর্টফ্যাক্ট লিঙ্ক থেকে সরাসরি লিনাক্স বাইনারি নামানো
          curl -s https://equinox.io --output ngrok.tgz
          sudo tar -xvzf ngrok.tgz -C /usr/local/bin
          rm ngrok.tgz
          
          # কমান্ডটি ঠিকমতো কাজ করছে কি না তা যাচাই করা
          ngrok --version

      - name: Configure ngrok Token
        run: |
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

      - name: Create and Start Android Emulator
        run: |
          echo "y" | sdkmanager --install "system-images;android-33;google_apis;x86_64"
          echo "no" | avdmanager create avd -n AndroidCloud -k "system-images;android-33;google_apis;x86_64" --force
          $ANDROID_HOME/emulator/emulator -avd AndroidCloud -no-window -no-audio -no-boot-anim -accel on -gpu off > /dev/null 2>&1 &
          echo "Android Emulator is booting up..."

      - name: Setup Web-scrcpy Server (For Mobile Browser Touch)
        run: |
          # ব্রাউজার ইন্টারফেসের জন্য ws-scrcpy ইনস্টল ও ব্যাকগ্রাউন্ডে চালু করা
          sudo npm install -g ws-scrcpy --unsafe-perm=true --allow-root
          ws-scrcpy > /dev/null 2>&1 &
          sleep 15

      - name: Start Safe HTTP Tunnel for Mobile
        run: |
          # পোর্ট ৮০০০ কে Ngrok এর মাধ্যমে পাবলিক ওয়েবসাইট লিঙ্কে রূপান্তর করা
          ngrok http 8000 > /dev/null 2>&1 &
          
          echo "=========================================================="
          echo "Android Web Server Started Successfully!"
          echo "Open your Ngrok Dashboard, copy the HTTP URL and open it in your Mobile Chrome Browser."
          echo "=========================================================="
          
          # সেশনটি ৬ ঘণ্টা সচল রাখবে
          sleep 21600 
